name: BoxHelper simulator captures

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Space-separated -only-testing values"
        default: "BoxHelperUITests/CaptureTests BoxHelperUITests/ExploreTests"
      boxhelper_ref:
        description: "BoxHelper commit or branch"
        default: "7d59046cd0f759c42e47779bbb46bc638b3f4b7f"
      device:
        description: "Simulator device type name"
        default: "iPhone 18 Pro"
      xcode:
        description: "Xcode version on the runner (Xcode_<version>.app)"
        default: "27.2"
      runner:
        description: "Runner label (standard size only)"
        default: "xcode-27"
      diag:
        description: "Run the icon diagnostics step"
        default: "false"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone BoxHelper at the requested ref
        run: |
          git clone --quiet https://github.com/HOCKULUS/BoxHelper.git bh
          git -C bh checkout --quiet "${{ inputs.boxhelper_ref }}"
          git -C bh log -1 --format='BoxHelper %H %cs %s'

      - name: Attach capture tests (build-step only; app sources untouched)
        run: |
          python3 scripts/add_uitests_group.py bh/BoxHelper.xcodeproj/project.pbxproj
          mkdir -p bh/BoxHelperUITests
          cp BoxHelperUITests/*.swift bh/BoxHelperUITests/
          cp scripts/Capture.xcscheme bh/BoxHelper.xcodeproj/xcshareddata/xcschemes/Capture.xcscheme
          # AppIconPride.icon (an optional home-screen alternate icon) crashes actool on
          # every runner Xcode; dropping its file reference leaves the in-app UI unchanged.
          # The AppIconPride.appiconset in Assets.xcassets still provides that alternate.
          sed -i '' '/AppIconPride\.icon/d' bh/BoxHelper.xcodeproj/project.pbxproj
          git -C bh diff --stat
          git -C bh status --short

      - name: Pick and boot simulator
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode }}.app"
          xcodebuild -version
          SDKVER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "simulator SDK $SDKVER"
          UDID=$(python3 scripts/pick_device.py "$SDKVER" "${{ inputs.device }}")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --operatorName ' ' --batteryState charged --batteryLevel 100

      - name: Diagnose icon compilation
        if: inputs.diag == 'true'
        run: |
          cd bh/BoxHelper
          for icon in AppIcon AppIconPride; do
            out=$(mktemp -d)
            echo "== $icon.icon alone"
            xcrun actool "$icon.icon" --compile "$out" --platform iphonesimulator --minimum-deployment-target 18.0 \
              --target-device iphone --app-icon "$icon" --output-partial-info-plist "$out/p.plist" \
              --errors --warnings --notices --output-format human-readable-text 2>&1 | tail -15
            echo "== $icon.icon ictool"
            xcrun ictool "$icon.icon" --export-preview iOS Light 128 128 1 0 "$out/prev.png" 2>&1 | tail -5; ls -la "$out" || true
          done
          echo "== Assets.xcassets alone"
          out=$(mktemp -d)
          xcrun actool Assets.xcassets --compile "$out" --platform iphonesimulator --minimum-deployment-target 18.0 \
            --target-device iphone --output-partial-info-plist "$out/p.plist" --errors --warnings --output-format human-readable-text 2>&1 | tail -15
          echo "== xcode-select -p: $(xcode-select -p)"; ls "$(xcode-select -p)/../Applications" || true

      - name: Build for testing (retries the intermittent .icon actool failure)
        run: |
          cd bh
          for attempt in 1 2 3; do
            xcodebuild build-for-testing \
              -project BoxHelper.xcodeproj \
              -scheme Capture \
              -destination "id=$UDID" \
              -derivedDataPath ../dd \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -solver-expression-time-threshold=600' \
              > ../xcodebuild.log 2>&1 && { echo "build ok on attempt $attempt"; exit 0; }
            echo "attempt $attempt failed:"
            grep -E "error:|warning: Icon export" ../xcodebuild.log | head -20
            find ../dd -name 'assetcatalog_*' -delete 2>/dev/null || true
          done
          exit 1

      - name: Run capture tests
        env:
          TEST_RUNNER_SHOT_DIR: ${{ github.workspace }}/shots
        run: |
          mkdir -p shots
          cd bh
          ONLY=""
          for t in ${{ inputs.test }}; do ONLY="$ONLY -only-testing:$t"; done
          set +e
          xcodebuild test-without-building \
            -project BoxHelper.xcodeproj \
            -scheme Capture \
            -destination "id=$UDID" \
            -derivedDataPath ../dd \
            $ONLY \
            -resultBundlePath ../result.xcresult \
            > ../test.log 2>&1
          rc=$?
          grep -E "error|Test Case|\*\* TEST" ../test.log | head -100
          cat ../test.log >> ../xcodebuild.log
          exit $rc

      - name: Final simctl screenshot
        if: always()
        run: xcrun simctl io "$UDID" screenshot shots/zz-simctl-final.png || true

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          if-no-files-found: warn

      - name: Upload log tail
        if: always()
        run: tail -n 300 xcodebuild.log > xcodebuild-tail.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: xcodebuild-tail.log
